name: Weekly Database Backup

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run backup script
        run: npm run db:backup

      - name: Get timestamp
        id: timestamp
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Encrypt credentials
        id: encode_creds
        shell: bash
        env:
          CREDS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: |
          # Base64 encode the JSON credentials because the action requires it
          echo "encoded=$(echo "$CREDS" | base64 -w 0)" >> $GITHUB_OUTPUT

      # Option 1: Upload to Google Drive
      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ steps.encode_creds.outputs.encoded }}
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          filename: backups/backup_*.json
          name: backup_${{ steps.timestamp.outputs.date }}.json
          overwrite: false

      # Option 2: Always save as GitHub Artifact (30-day retention, free)
      - name: Upload backup as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ steps.timestamp.outputs.date }}
          path: backups/*.json
          retention-days: 30
